name: Provjera

on:
    pull_request:

permissions:
    contents: read

env:
    CF_SEND_TELEMETRY: 'false'
    DO_NOT_TRACK: '1'

jobs:
    provjeri:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Preuzimanje repozitorijuma
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Podešavanje Node-a
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version-file: package.json
                  package-manager-cache: false

            - name: Podešavanje zaključanog pnpm-a
              uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
              with:
                  run_install: false

            - name: Instaliranje zaključanih zavisnosti
              run: pnpm install --frozen-lockfile

            - name: Testovi
              run: pnpm test

            - name: Provjera tipova
              run: pnpm provjeri-tipove

            - name: ESLint
              run: pnpm exec eslint src test

            - name: Formatiranje
              run: pnpm exec prettier --check src test .github package.json pnpm-workspace.yaml cloudflare.config.ts vite.config.ts tsconfig.json

            - name: Izgradnja produkcionog izlaza
              run: pnpm worker-izgradi --mode production

            - name: Provjera istog izlaza bez kredencijala
              run: pnpm exec cf deploy --prebuilt --mode production --dry-run
